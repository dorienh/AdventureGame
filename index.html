<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Play Kristna - DOS Game</title>
<!-- js-dos style sheet -->
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">

<!-- js-dos -->
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #111;
      color: white;
      margin: 0;
    }
    h1 {
      margin-top: 20px;
    }
    #dosbox {
      width: 90%;
      max-width: 800px;
      height: 600px;
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <h1>Patience - Classic DOS Game</h1>
  <div id="dosbox"></div>
  
  <script>
    // Wait for the JSDOS script to load and initialize
    window.addEventListener('load', () => {
      // Check if the JSDOS global object is available (e.g., DosBox or a similar export)
      if (typeof window.DosBox !== 'undefined') {
        const dos = new DosBox(document.getElementById("dosbox"), {
          wdosboxUrl: "https://v8.js-dos.com/latest/wdosbox.js"
        });
        dos.run("kirsta/patience/kca1.jsdos").catch(error => {
          console.error("Failed to run DOS game:", error);
        });
      } else {
        console.error("JSDOS v8 API (DosBox) not found. Check the script URL.");
      }
    });
  </script>
  <!-- <script>
    Dos(document.getElementById("dosbox")).run("kirsta/patience/kca1.jsdos");
  </script> -->

</body>
</html>
