<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Play Kristna Adventure Game</title>
<!-- js-dos style sheet -->
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">

<!-- js-dos -->
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1f1f1f, #2a2a2a);
        color: white;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 40px 20px;
      }
    
      h1 {
        margin: 10px 0;
        font-size: 1.2em;
        font-weight: 600;
        color: #f0f0f0;
      }
    
      p {
        max-width: 600px;
        margin: 0 auto 30px auto;
        font-size: 1.1em;
        color: #ccc;
      }
    
      #dosbox {
        width: 90%;
        max-width: 800px;
        height: 600px;
        margin: 0 auto;
        border-radius: 16px;
        overflow: hidden;
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.05);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
  </style>
</head>
<body>
  <h1>KCA1 - Classic DOS Game</h1>
  
<p>I dug up this game from an old floppy disk: Kirsta Adventure Game (kca1). Let me know if you can solve it!

Dorien</p>

<p>Click the big play button below to start. And if you need help getting started, here is the <a href="kirsta.jpg" target="_blank">map</a> I've drawn out so far.</p>

  <div id="dosbox"></div>
  

  <script>

    Dos(document.getElementById("dosbox"), {
      url: "kca1.jsdos",
  });


  </script>
  <!-- const jsdos = DOSBox(document.getElementById('dosbox'));
  jsdos.run('kca1.jsdos'); -->
</body>
</html>
