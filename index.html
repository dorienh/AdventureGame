  <script>
    const dos = new Dos(document.getElementById("dosbox"), { 
      wdosboxUrl: "https://v8.js-dos.com/latest/wdosbox.js"
    });
    fetch("kirsta/patience/kca1.jsdos")
      .then(response => response.arrayBuffer())
      .then(bundle => dos.runBundle(bundle))
      .catch(error => console.error("Failed to run DOS game:", error));
  </script>
