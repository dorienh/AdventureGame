<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Play Kristna - DOS Game</title>
<!-- js-dos style sheet -->
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">

<!-- js-dos -->
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #111;
      color: white;
      margin: 0;
    }
    h1 {
      margin-top: 20px;
    }
    #dosbox {
      width: 90%;
      max-width: 800px;
      height: 600px;
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <h1>KCA1 - Classic DOS Game</h1>
  
  <div id="game-list">
    <button onclick="loadGame('kca1.jsdos')">Play Patience</button>
  </div>

  <div id="dosbox"></div>
  
  

  <script>
    function loadGame(path) {
      if (dosInstance) dosInstance.stop();
      dosInstance = Dos(document.getElementById("dosbox"));
      dosInstance.run(path);
    }
    Dos(document.getElementById("dosbox")).run("kca1.jsdos");
  </script>
  
  <img src="thumbnail.png" alt="Patience" onclick="loadGame('kca1.jsdos')" style="cursor:pointer;">

</body>
</html>
