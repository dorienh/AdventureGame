<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Play Kristna - DOS Game</title>
<!-- js-dos style sheet -->
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">

<!-- js-dos -->
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #111;
      color: white;
      margin: 0;
    }
    h1 {
      margin-top: 20px;
    }
    #dosbox {
      width: 90%;
      max-width: 800px;
      height: 600px;
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <h1>Patience - Classic DOS Game</h1>
  <div id="dosbox"></div>
  
  <script>
    window.addEventListener('load', () => {
      // Try to detect the JSDOS v8 API
      if (typeof window.JSDOS !== 'undefined') {
        const dos = new JSDOS(document.getElementById("dosbox"), {
        });
        dos.run("kirsta/patience/kca1.jsdos").catch(error => {
          console.error("Failed to run DOS game:", error);
        });
      } else if (typeof window.Dos !== 'undefined') {
        const dos = new Dos(document.getElementById("dosbox"), {
        });
        dos.run("kirsta/patience/kca1.jsdos").catch(error => {
          console.error("Failed to run DOS game:", error);
        });
      } else {
        console.error("JSDOS v8 API not found. Check the script URL or exports.");
      }
    });
  </script>
  <!-- <script>
    Dos(document.getElementById("dosbox")).run("kirsta/patience/kca1.jsdos");
  </script> -->

</body>
</html>
