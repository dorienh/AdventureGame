<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Play Kristna - DOS Game</title>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #111;
      color: white;
      margin: 0;
    }
    h1 {
      margin-top: 20px;
    }
    #dosbox {
      width: 90%;
      max-width: 800px;
      height: 600px;
      margin: 20px auto;
      border: 2px dashed #fff;
      line-height: 600px;
    }
  </style>
</head>
<body>
  <h1>Patience - Classic DOS Game</h1>
  <div id="dosbox">Drag and drop the kca1.jsdos file here</div>

  <script>
    const el = document.getElementById("dosbox");
    Dos(el).ready((fs) => {
      el.ondragover = (e) => { e.preventDefault(); el.style.border = "2px solid #0f0"; };
      el.ondrop = (e) => {
        e.preventDefault();
        el.style.border = "2px dashed #fff";
        const file = e.dataTransfer.files[0];
        if (file.name.endsWith(".jsdos")) {
          fs.run(file);
        } else {
          alert("Please drop a .jsdos file.");
        }
      };
    });
  </script>
</body>
</html>
