[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://v8.js-dos.com; style-src 'self' 'unsafe-inline' https://v8.js-dos.com; connect-src 'self' https://v8.js-dos.com blob: data:; worker-src 'self' blob:; child-src 'self' blob:;"